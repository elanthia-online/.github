# Keeps this repository consistent: the RuboCop hashes in ruby-ci.yml must
# match rubocop/, every ruleset definition must be valid JSON, and
# bin/sync-lockfile and the lockfile-sync workflow must work. The ci-gate job
# is named ci-gate because this repo's own ruleset requires a check by that
# name.
name: self-check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  consistency:
    name: consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: RuboCop hashes in ruby-ci.yml match rubocop/
        run: |
          set -euo pipefail
          base=$(grep -oP 'RUBOCOP_BASE_SHA256: \K[0-9a-f]{64}' .github/workflows/ruby-ci.yml)
          cop=$(grep -oP 'RUBOCOP_COP_SHA256: \K[0-9a-f]{64}' .github/workflows/ruby-ci.yml)
          printf '%s  %s\n' "$base" rubocop/base.yml "$cop" rubocop/cops/ascii_only_source.rb | sha256sum -c -
      - name: Ruleset definitions are valid JSON
        run: |
          set -euo pipefail
          for f in rulesets/*.json; do jq -e . "$f" > /dev/null && echo "valid JSON: $f"; done

  sync-lockfile:
    name: sync-lockfile tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '4.0'
      # Includes two tests that run `bundle lock` against rubygems.org.
      - run: ruby test/sync_lockfile_test.rb

  # Runs the shared workflow the way a repo calls it, against fixtures, so a
  # change that breaks it (its own checkout by job.workflow_sha, say) fails
  # here before any repo pins it.
  lockfile-sync-workflow:
    uses: ./.github/workflows/lockfile-sync.yml
    with:
      reference: test/fixtures/lockfile-sync/reference
      directory: test/fixtures/lockfile-sync/aligned

  ci-gate:
    name: ci-gate
    if: always()
    needs: [consistency, sync-lockfile, lockfile-sync-workflow]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
